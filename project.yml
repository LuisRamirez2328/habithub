name: HabitHarbor
options:
  bundleIdPrefix: com.luisramirez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
packages:
  HabitCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HabitHarbor:
    type: application
    platform: iOS
    sources:
      - HabitHarbor
    dependencies:
      - package: HabitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luisramirez.habithub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
