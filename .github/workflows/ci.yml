name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests (swift test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

  ios-build:
    name: iOS app build (xcodebuild)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project HabitHarbor.xcodeproj \
            -scheme HabitHarbor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
